name: sdp-ecommerce-pipeline

libraries:
  - glob:
      include: /opt/spark/pipeline/ecommerce/bronze_ingestion.py

# Local path for pipeline catalog metadata (ephemeral container — no persistence needed).
# Actual Delta table locations are set per-view in bronze_ingestion.py.
storage: "file:///tmp/sdp-pipeline/ecommerce"

database: default

configuration:
  spark.sql.shuffle.partitions: "4"
  spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"

  # Azure Blob Storage — SharedKey auth for ABFS.
  # Account name and key are injected by envsubst at container startup:
  #   envsubst '${AZURE_STORAGE_ACCOUNT_NAME} ${AZURE_STORAGE_ACCOUNT_KEY}' \
  #     < pipeline.yml > /tmp/pipeline.yml
  spark.hadoop.fs.azure.account.key.${AZURE_STORAGE_ACCOUNT_NAME}.dfs.core.windows.net: "${AZURE_STORAGE_ACCOUNT_KEY}"
