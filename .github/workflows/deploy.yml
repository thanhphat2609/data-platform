name: Deploy Data Platform

# Triggers:
#   - Push to main → deploys all three VMs automatically
#   - Manual trigger → choose which VM to deploy (useful for partial updates)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which VM to deploy"
        required: false
        default: all
        type: choice
        options: [all, control, worker1, worker2]

# Repo path on every VM — must match where you cloned the repo
env:
  REPO_PATH: ~/data-platform

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   GitHub
#     GH_TOKEN                Personal Access Token (repo scope) — git fetch on VMs
#
#   VM access
#     CTRL_VM_IP              Public IP of the Control / Master VM
#     WORKER1_VM_IP           Public IP of Worker VM 1
#     WORKER2_VM_IP           Public IP of Worker VM 2
#     VM_SSH_USER             SSH username on all VMs (e.g. azureuser)
#     CTRL_VM_SSH_KEY         Private SSH key for Control VM
#     WORKER1_VM_SSH_KEY      Private SSH key for Worker VM 1
#     WORKER2_VM_SSH_KEY      Private SSH key for Worker VM 2
#
#   Dagster
#     DAGSTER_DB_PASSWORD     Postgres password for Dagster metadata DB
#
#   Azure Blob Storage
#     AZURE_STORAGE_ACCOUNT_NAME
#     AZURE_STORAGE_ACCOUNT_KEY
#
# Source database credentials are NOT secrets — demo containers use fixed
# credentials (admin / admin123) on the master VM, constructed inline below.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Control VM — webserver + daemon + Redis + metadata DB
  # ───────────────────────────────────────────────────────────────────────────
  deploy-control:
    name: "Control VM"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'control'
    steps:
      - name: SSH → git pull → write .env → docker compose up
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
          DAGSTER_DB_PASSWORD:        ${{ secrets.DAGSTER_DB_PASSWORD }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY:  ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          DLT_IMAGE:                  dlt-pipeline:latest
          SDP_IMAGE:                  spark-pipeline:latest
        with:
          host:            ${{ secrets.CTRL_VM_IP }}
          username:        ${{ secrets.VM_SSH_USER }}
          key:             ${{ secrets.CTRL_VM_SSH_KEY }}
          command_timeout: 10m
          envs: GH_TOKEN,DAGSTER_DB_PASSWORD,AZURE_STORAGE_ACCOUNT_NAME,AZURE_STORAGE_ACCOUNT_KEY,DLT_IMAGE,SDP_IMAGE
          script: |
            set -e

            echo "── ensure docker ─────────────────────────"
            if ! command -v docker &>/dev/null; then
              echo "Docker not found — installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi
            groups | grep -q '\bdocker\b' || docker() { sudo docker "$@"; }

            cd ${{ env.REPO_PATH }}

            echo "── git pull ──────────────────────────────"
            git remote set-url origin "https://${GH_TOKEN}@github.com/thanhphat2609/data-platform.git"
            git fetch origin main
            git reset --hard origin/main

            echo "── write .env ────────────────────────────"
            {
              printf 'DAGSTER_DB_PASSWORD=%s\n'        "$DAGSTER_DB_PASSWORD"
              printf 'AZURE_STORAGE_ACCOUNT_NAME=%s\n' "$AZURE_STORAGE_ACCOUNT_NAME"
              printf 'AZURE_STORAGE_ACCOUNT_KEY=%s\n'  "$AZURE_STORAGE_ACCOUNT_KEY"
              printf 'DLT_IMAGE=%s\n'                  "$DLT_IMAGE"
              printf 'SDP_IMAGE=%s\n'                  "$SDP_IMAGE"
            } > infrastructure/dagster/control/.env

            echo "── docker compose up ─────────────────────"
            docker compose \
              -f infrastructure/dagster/control/docker-compose.yml \
              --env-file infrastructure/dagster/control/.env \
              up --build -d

            echo "── status ────────────────────────────────"
            docker compose -f infrastructure/dagster/control/docker-compose.yml ps

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Worker VM 1 — Celery worker for dlt pipelines (queue: worker-1)
  #    Depends on control being up (or already running if deploy-control skipped)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker1:
    name: "Worker VM 1 (dlt)"
    runs-on: ubuntu-latest
    needs: deploy-control
    # Run if: control succeeded OR control was skipped (manual worker-only deploy)
    if: >-
      (needs.deploy-control.result == 'success' || needs.deploy-control.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.target == 'all' ||
       github.event.inputs.target == 'worker1')
    steps:
      - name: SSH → git pull → build dlt image → write .env → docker compose up
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
          CTRL_VM_IP:                 ${{ secrets.CTRL_VM_IP }}
          DAGSTER_DB_PASSWORD:        ${{ secrets.DAGSTER_DB_PASSWORD }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY:  ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        with:
          host:            ${{ secrets.WORKER1_VM_IP }}
          username:        ${{ secrets.VM_SSH_USER }}
          key:             ${{ secrets.WORKER1_VM_SSH_KEY }}
          command_timeout: 15m
          envs: GH_TOKEN,CTRL_VM_IP,DAGSTER_DB_PASSWORD,AZURE_STORAGE_ACCOUNT_NAME,AZURE_STORAGE_ACCOUNT_KEY
          script: |
            set -e

            echo "── ensure docker ─────────────────────────"
            if ! command -v docker &>/dev/null; then
              echo "Docker not found — installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi
            groups | grep -q '\bdocker\b' || docker() { sudo docker "$@"; }

            cd ${{ env.REPO_PATH }}

            echo "── git pull ──────────────────────────────"
            git remote set-url origin "https://${GH_TOKEN}@github.com/thanhphat2609/data-platform.git"
            git fetch origin main
            git reset --hard origin/main

            echo "── build dlt image (~2 min) ──────────────"
            docker build -t dlt-pipeline:latest -f infrastructure/dlt/Dockerfile .

            echo "── build dbt image ───────────────────────"
            docker build -t dbt-pipeline:latest -f infrastructure/dbt/Dockerfile .

            echo "── build dagster image ───────────────────"
            docker build \
              -t dagster-worker:latest \
              -f infrastructure/dagster/Dockerfile .

            echo "── write .env.worker1 ────────────────────"
            {
              printf 'DAGSTER_POSTGRES_URL=%s\n' \
                "postgresql://dagster:${DAGSTER_DB_PASSWORD}@${CTRL_VM_IP}:5432/dagster"
              printf 'CELERY_BROKER_URL=%s\n'     "redis://${CTRL_VM_IP}:6379/0"
              printf 'CELERY_RESULT_BACKEND=%s\n' "redis://${CTRL_VM_IP}:6379/0"
              printf 'DLT_IMAGE=%s\n'                  "dlt-pipeline:latest"
              printf 'DBT_IMAGE=%s\n'                  "dbt-pipeline:latest"
              printf 'AZURE_STORAGE_ACCOUNT_NAME=%s\n' "$AZURE_STORAGE_ACCOUNT_NAME"
              printf 'AZURE_STORAGE_ACCOUNT_KEY=%s\n'  "$AZURE_STORAGE_ACCOUNT_KEY"
              # Demo CRM DB — fixed credentials, hosted on master VM port 5431
              printf 'POSTGRES_CONNECTION_STRING=%s\n' \
                "postgresql://admin:admin123@${CTRL_VM_IP}:5431/crm"
            } > infrastructure/dagster/worker/.env.worker1

            echo "── docker compose up ─────────────────────"
            docker compose \
              -f infrastructure/dagster/worker/docker-compose-worker1.yml \
              --env-file infrastructure/dagster/worker/.env.worker1 \
              up --build -d

            echo "── status ────────────────────────────────"
            docker compose -f infrastructure/dagster/worker/docker-compose-worker1.yml ps

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Worker VM 2 — Celery worker for SDP/Spark pipelines (queue: worker-2)
  #    Spark image build takes ~5 min — timeout set to 20 min
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker2:
    name: "Worker VM 2 (SDP/Spark)"
    runs-on: ubuntu-latest
    needs: deploy-control
    if: >-
      (needs.deploy-control.result == 'success' || needs.deploy-control.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.target == 'all' ||
       github.event.inputs.target == 'worker2')
    steps:
      - name: SSH → git pull → build spark image → write .env → docker compose up
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
          CTRL_VM_IP:                 ${{ secrets.CTRL_VM_IP }}
          DAGSTER_DB_PASSWORD:        ${{ secrets.DAGSTER_DB_PASSWORD }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY:  ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        with:
          host:            ${{ secrets.WORKER2_VM_IP }}
          username:        ${{ secrets.VM_SSH_USER }}
          key:             ${{ secrets.WORKER2_VM_SSH_KEY }}
          command_timeout: 20m
          envs: GH_TOKEN,CTRL_VM_IP,DAGSTER_DB_PASSWORD,AZURE_STORAGE_ACCOUNT_NAME,AZURE_STORAGE_ACCOUNT_KEY
          script: |
            set -e

            echo "── ensure docker ─────────────────────────"
            if ! command -v docker &>/dev/null; then
              echo "Docker not found — installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi
            groups | grep -q '\bdocker\b' || docker() { sudo docker "$@"; }

            cd ${{ env.REPO_PATH }}

            echo "── git pull ──────────────────────────────"
            git remote set-url origin "https://${GH_TOKEN}@github.com/thanhphat2609/data-platform.git"
            git fetch origin main
            git reset --hard origin/main

            echo "── build spark image (~5 min) ────────────"
            docker build -t spark-pipeline:latest -f infrastructure/spark/Dockerfile.spark .

            echo "── build dbt image ───────────────────────"
            docker build -t dbt-pipeline:latest -f infrastructure/dbt/Dockerfile .

            echo "── build dagster image ───────────────────"
            docker build \
              -t dagster-worker:latest \
              -f infrastructure/dagster/Dockerfile .

            echo "── write .env.worker2 ────────────────────"
            {
              printf 'DAGSTER_POSTGRES_URL=%s\n' \
                "postgresql://dagster:${DAGSTER_DB_PASSWORD}@${CTRL_VM_IP}:5432/dagster"
              printf 'CELERY_BROKER_URL=%s\n'     "redis://${CTRL_VM_IP}:6379/0"
              printf 'CELERY_RESULT_BACKEND=%s\n' "redis://${CTRL_VM_IP}:6379/0"
              printf 'SDP_IMAGE=%s\n'             "spark-pipeline:latest"
              printf 'DBT_IMAGE=%s\n'             "dbt-pipeline:latest"
              printf 'AZURE_STORAGE_ACCOUNT_NAME=%s\n' "$AZURE_STORAGE_ACCOUNT_NAME"
              printf 'AZURE_STORAGE_ACCOUNT_KEY=%s\n'  "$AZURE_STORAGE_ACCOUNT_KEY"
              # Demo ecommerce DB — fixed credentials, hosted on master VM port 3306
              printf 'MYSQL_HOST=%s\n'     "$CTRL_VM_IP"
              printf 'MYSQL_PORT=%s\n'     "3306"
              printf 'MYSQL_DB=%s\n'       "ecommerce"
              printf 'MYSQL_USER=%s\n'     "admin"
              printf 'MYSQL_PASSWORD=%s\n' "admin123"
              # Demo manage DB — fixed credentials, hosted on master VM port 5433
              printf 'POSTGRES_HOST=%s\n'      "$CTRL_VM_IP"
              printf 'POSTGRES_PORT=%s\n'      "5433"
              printf 'POSTGRES_MANAGE_DB=%s\n' "manage"
              printf 'POSTGRES_USER=%s\n'      "admin"
              printf 'POSTGRES_PASSWORD=%s\n'  "admin123"
            } > infrastructure/dagster/worker/.env.worker2

            echo "── docker compose up ─────────────────────"
            docker compose \
              -f infrastructure/dagster/worker/docker-compose-worker2.yml \
              --env-file infrastructure/dagster/worker/.env.worker2 \
              up --build -d

            echo "── status ────────────────────────────────"
            docker compose -f infrastructure/dagster/worker/docker-compose-worker2.yml ps
