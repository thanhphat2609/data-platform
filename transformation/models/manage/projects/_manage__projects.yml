version: 2

sources:
  - name: manage
    tables:
      - name: projects
        description: Projects from PostgreSQL manage DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/manage/bronze_projects')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_manage__projects
    description: Latest manage projects snapshot (light rename/cast only).
    columns:
      - name: project_id
        tests: [not_null, unique]
      - name: owner_id
        tests:
          - relationships:
              to: ref('stg_manage__users')
              field: user_id
