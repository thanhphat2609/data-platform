name: sdp-manage-pipeline

libraries:
  - glob:
      include: bronze_ingestion.py

# Delta metadata / checkpoint root
storage: "wasb://bronze@devstoreaccount1.blob.core.windows.net/sdp/manage"

database: default

configuration:
  spark.sql.shuffle.partitions: "4"

  # Delta Lake
  spark.sql.extensions:            "io.delta.sql.DeltaSparkSessionExtension"
  spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
  spark.sql.warehouse.dir:         "wasb://bronze@devstoreaccount1.blob.core.windows.net/sdp/warehouse"

  # Azure Blob Storage — Azurite emulator
  # devstoreaccount1.blob.core.windows.net resolves to azurite:80 via docker network alias
  spark.hadoop.fs.azure.account.key.devstoreaccount1.blob.core.windows.net: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMw=="

  # DataFlint observability — not included in demo image; add JAR to enable
  # spark.plugins: "io.dataflint.spark.SparkDataflintPlugin"
