services:

  # ─────────────────────────────────────────
  # Source: PostgreSQL — platform DB
  # Tables seeded by postgres/01_init.sql
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: dlt_postgres
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlt_network

volumes:
  postgres_data:

networks:
  dlt_network:
    driver: bridge
