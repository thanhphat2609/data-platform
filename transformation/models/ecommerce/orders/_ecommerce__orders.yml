version: 2

sources:
  - name: ecommerce
    tables:
      - name: orders
        description: Orders from MySQL ecommerce DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/ecommerce/bronze_orders')"
        columns:
          - name: id
            tests: [not_null, unique]
          - name: customer_id
            tests: [not_null]

models:
  - name: stg_ecommerce__orders
    description: Latest ecommerce orders snapshot (light rename/cast only).
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_ecommerce__customers')
              field: customer_id

  - name: int_ecommerce__orders
    description: Orders enriched with rolled-up line-item totals from order_items.
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: mart_ecommerce__fct_orders
    description: >
      Order-grain fact table, written to gold as Parquet. Reference example
      of the full staging -> intermediate -> mart pattern for this project —
      other entities add int_/mart_ models the same way once real business
      logic exists for them.
    columns:
      - name: order_id
        tests: [not_null, unique]
