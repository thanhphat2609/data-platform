version: 2

sources:
  - name: ecommerce
    tables:
      - name: products
        description: Products from MySQL ecommerce DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/ecommerce/bronze_products')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_ecommerce__products
    description: Latest ecommerce products snapshot (light rename/cast only).
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: category_id
        tests:
          - relationships:
              to: ref('stg_ecommerce__categories')
              field: category_id
