version: 2

sources:
  - name: manage
    tables:
      - name: users
        description: Users from PostgreSQL manage DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/manage/bronze_users')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_manage__users
    description: Latest manage users snapshot (light rename/cast only).
    columns:
      - name: user_id
        tests: [not_null, unique]
