version: 2

sources:
  - name: ecommerce
    tables:
      - name: order_items
        description: Order line items from MySQL ecommerce DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/ecommerce/bronze_order_items')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_ecommerce__order_items
    description: Latest ecommerce order line items snapshot (light rename/cast only).
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_ecommerce__orders')
              field: order_id
