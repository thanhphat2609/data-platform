# Demo source databases
#
# Run these on the master VM alongside the control plane (control/docker-compose.yml).
# Workers on separate VMs connect via CTRL_VM_IP:PORT — no shared Docker network needed.
#
# Port layout (chosen to avoid conflicts with ctrl_dagster_db on 5432):
#   5431 — PostgreSQL CRM   (dlt source)
#   3306 — MySQL ecommerce  (SDP source)
#   5433 — PostgreSQL manage (SDP source)
#
# Usage:
#   docker compose -f infrastructure/dagster/demo/docker-compose.yml up -d

services:

  # ─────────────────────────────────────────
  # dlt source — PostgreSQL CRM
  # Tables: orders, customers, products
  # ─────────────────────────────────────────
  postgres-crm:
    image: postgres:15
    container_name: demo_postgres_crm
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       crm
    ports:
      - "5431:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
      - ../../../ingestion/dlt/demo/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # SDP source — MySQL ecommerce
  # Tables: customers, orders, products, order_items, categories
  # ─────────────────────────────────────────
  mysql-ecommerce:
    image: mysql:8.4
    container_name: demo_mysql_ecommerce
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:      ecommerce
      MYSQL_USER:          admin
      MYSQL_PASSWORD:      admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../../ingestion/sdp/demo/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # SDP source — PostgreSQL manage
  # Tables: users, projects, tasks, issues, comments
  # ─────────────────────────────────────────
  postgres-manage:
    image: postgres:15
    container_name: demo_postgres_manage
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       manage
    ports:
      # 5433 avoids conflict with ctrl_dagster_db on 5432
      - "5433:5432"
    volumes:
      - postgres_manage_data:/var/lib/postgresql/data
      - ../../../ingestion/sdp/demo/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d manage"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_crm_data:
  postgres_manage_data:
  mysql_data:
