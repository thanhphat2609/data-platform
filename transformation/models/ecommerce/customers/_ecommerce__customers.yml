version: 2

sources:
  - name: ecommerce
    tables:
      - name: customers
        description: Customers snapshot from MySQL ecommerce DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/ecommerce/bronze_customers')"
        columns:
          - name: id
            tests: [not_null, unique]
          - name: email
            tests: [not_null]

models:
  - name: stg_ecommerce__customers
    description: Latest ecommerce customers snapshot (light rename/cast only).
    columns:
      - name: customer_id
        tests: [not_null, unique]
