version: 2

sources:
  - name: ecommerce
    tables:
      - name: categories
        description: Product categories from MySQL ecommerce DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/ecommerce/bronze_categories')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_ecommerce__categories
    description: Latest ecommerce categories snapshot (light rename/cast only).
    columns:
      - name: category_id
        tests: [not_null, unique]
