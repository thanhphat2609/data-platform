name: sdp-ecommerce-pipeline

libraries:
  - glob:
      include: bronze_ingestion.py

# Local path for pipeline catalog metadata — container is ephemeral so no
# need to persist this. Actual data locations are set per-view in bronze_ingestion.py.
storage: "file:///tmp/sdp-pipeline/ecommerce"

database: default

configuration:
  spark.sql.shuffle.partitions: "4"
  spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"

  # Azure Blob auth is configured dynamically in bronze_ingestion.py
  # using AZURE_STORAGE_ACCOUNT_NAME / AZURE_STORAGE_ACCOUNT_KEY env vars.
  # No account name or key is hardcoded here.
