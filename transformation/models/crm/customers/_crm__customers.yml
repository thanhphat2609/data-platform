version: 2

sources:
  - name: crm
    tables:
      - name: customers
        description: Full-load customer snapshot from CRM PostgreSQL, landed by dlt.
        meta:
          external_location: "read_parquet('az://bronze/dlt/crm/customers/*/*.parquet', hive_partitioning=true)"
        columns:
          - name: id
            tests: [not_null, unique]
          - name: email
            tests: [not_null]

models:
  - name: stg_crm__customers
    description: Latest CRM customers snapshot (light rename/cast only).
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
