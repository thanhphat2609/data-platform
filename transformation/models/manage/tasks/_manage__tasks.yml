version: 2

sources:
  - name: manage
    tables:
      - name: tasks
        description: Tasks from PostgreSQL manage DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/manage/bronze_tasks')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_manage__tasks
    description: Latest manage tasks snapshot (light rename/cast only).
    columns:
      - name: task_id
        tests: [not_null, unique]
      - name: project_id
        tests:
          - relationships:
              to: ref('stg_manage__projects')
              field: project_id
