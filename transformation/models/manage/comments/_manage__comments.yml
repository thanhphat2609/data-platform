version: 2

sources:
  - name: manage
    tables:
      - name: comments
        description: Comments (on tasks/issues) from PostgreSQL manage DB, landed as Delta by Spark SDP.
        meta:
          external_location: "delta_scan('az://bronze/sdp/manage/bronze_comments')"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_manage__comments
    description: Latest manage comments snapshot (light rename/cast only).
    columns:
      - name: comment_id
        tests: [not_null, unique]
      - name: entity_type
        tests:
          - accepted_values:
              values: ['task', 'issue']
