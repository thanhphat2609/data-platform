name: sdp-ecommerce-pipeline

libraries:
  - glob:
      include: bronze_ingestion.py

# Delta metadata / checkpoint root
storage: "abfss://bronze@dataplatformstrorage.dfs.core.windows.net/sdp/ecommerce"

database: default

configuration:
  spark.sql.shuffle.partitions: "4"

  # Delta Lake
  spark.sql.extensions:            "io.delta.sql.DeltaSparkSessionExtension"
  spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
  # spark.sql.warehouse.dir:         "abfss://bronze@dataplatformstrorage.dfs.core.windows.net/sdp/warehouse"

  # Azure Blob Storage (ABFS — SharedKey auth)
  # Key property must use the DFS endpoint suffix (.dfs.core.windows.net)
  spark.hadoop.fs.azure.account.key.dataplatformstrorage.dfs.core.windows.net: "IF0VxOt9qrjqA5E+h1x1qNtUl13YyAMGp2NTL7zwH9o7kqBVhSuBkLzUbN0WZM803syy5Uy18JUo+AStKGJ4vA=="

  # DataFlint observability — not included in demo image; add JAR to enable
