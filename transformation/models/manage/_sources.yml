version: 2

# Manage — PostgreSQL, landed as Delta tables by Spark SDP.
# Prod path: az://bronze/sdp/manage/bronze_{table}  (Delta format)
# Dev path:  local/manage/bronze_{table}.csv
#
# Source resolution: pre_init_sql in profiles.yml creates schema-qualified VIEWs
# at connection startup (manage.users, manage.projects, manage.tasks, manage.issues, manage.comments).
# dbt resolves {{ source('manage', 'users') }} → manage.users automatically.

sources:
  - name: manage
    schema: manage
    description: Project management data from PostgreSQL, landed as Delta tables by Spark SDP.
    tables:
      - name: users
        description: Users from PostgreSQL manage DB.
        columns:
          - name: id
            tests: [not_null, unique]

      - name: projects
        description: Projects from PostgreSQL manage DB.
        columns:
          - name: id
            tests: [not_null, unique]

      - name: tasks
        description: Tasks from PostgreSQL manage DB.
        columns:
          - name: id
            tests: [not_null, unique]

      - name: issues
        description: Issues from PostgreSQL manage DB.
        columns:
          - name: id
            tests: [not_null, unique]

      - name: comments
        description: Comments (on tasks/issues) from PostgreSQL manage DB.
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_manage__users
    description: Latest manage users snapshot (light rename/cast only).
    columns:
      - name: user_id
        tests: [not_null, unique]

  - name: stg_manage__projects
    description: Latest manage projects snapshot (light rename/cast only).
    columns:
      - name: project_id
        tests: [not_null, unique]
      - name: owner_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_manage__users')
                field: user_id

  - name: stg_manage__tasks
    description: Latest manage tasks snapshot (light rename/cast only).
    columns:
      - name: task_id
        tests: [not_null, unique]
      - name: project_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_manage__projects')
                field: project_id

  - name: stg_manage__issues
    description: Latest manage issues snapshot (light rename/cast only).
    columns:
      - name: issue_id
        tests: [not_null, unique]
      - name: project_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_manage__projects')
                field: project_id

  - name: stg_manage__comments
    description: Latest manage comments snapshot (light rename/cast only).
    columns:
      - name: comment_id
        tests: [not_null, unique]
      - name: entity_type
        tests:
          - accepted_values:
              arguments:
                values: ['task', 'issue']

  - name: int_manage__tasks
    description: >
      Tasks enriched with project name and status for easier downstream use.
      Written to silver (dev: local/silver/manage/int_tasks / prod: az://silver/manage/int_tasks).
    columns:
      - name: task_id
        tests: [not_null, unique]
