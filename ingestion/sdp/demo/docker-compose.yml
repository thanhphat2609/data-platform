services:

  # ─────────────────────────────────────────
  # Source: PostgreSQL — project management
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: sdp_postgres
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       manage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d manage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdp_network

  # ─────────────────────────────────────────
  # Source: MySQL — ecommerce
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: sdp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:      ecommerce
      MYSQL_USER:          admin
      MYSQL_PASSWORD:      admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sdp_network

volumes:
  postgres_data:
  mysql_data:
  azurite_data:

networks:
  sdp_network:
    driver: bridge
