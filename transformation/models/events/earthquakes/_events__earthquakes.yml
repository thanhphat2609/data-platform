version: 2

sources:
  - name: events
    tables:
      - name: earthquake_events
        description: USGS earthquake feed, landed by dlt (append-only time series).
        meta:
          external_location: "read_parquet('az://bronze/dlt/events/earthquake_events/*/*.parquet', hive_partitioning=true)"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_events__earthquakes
    description: >
      Earthquake events, full history (no ingestion_date filter — this is an
      append-only source, every partition is a real batch of new records).
    columns:
      - name: event_id
        tests: [not_null, unique]
