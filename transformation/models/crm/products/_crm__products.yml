version: 2

sources:
  - name: crm
    tables:
      - name: products
        description: Full-load products snapshot from CRM PostgreSQL, landed by dlt.
        meta:
          external_location: "read_parquet('az://bronze/dlt/crm/products/*/*.parquet', hive_partitioning=true)"
        columns:
          - name: id
            tests: [not_null, unique]

models:
  - name: stg_crm__products
    description: Latest CRM products snapshot (light rename/cast only).
    columns:
      - name: product_id
        tests: [not_null, unique]
