# NON-PROD — Single-VM demo stack
#
# Everything runs on ONE machine. Workers are Docker containers that simulate
# separate VMs — Celery routing is real, hardware isolation is not.
# DOCKER_NETWORK=demo_network lets spawned pipeline containers reach the source
# DBs that live in the same Docker network on this VM.
#
# For real multi-VM deployment see:
#   docker-compose-prod.yml      — control plane (webserver + daemon + Redis + DB)
#   docker-compose-worker1.yml   — deploy to Worker VM 1 (dlt queue)
#   docker-compose-worker2.yml   — deploy to Worker VM 2 (SDP queue)

services:

  # ═════════════════════════════════════════
  # Dagster services
  # ═════════════════════════════════════════

  # Dagster metadata database
  dagster-db:
    image: postgres:15-alpine
    container_name: demo_dagster_db
    environment:
      POSTGRES_DB:       dagster
      POSTGRES_USER:     dagster
      POSTGRES_PASSWORD: dagster
    ports:
      - "5434:5432"
    volumes:
      - dagster_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo_network

  # Dagster — webserver (UI on :3000)
  dagster-webserver:
    build:
      context: ../../..
      dockerfile: infrastructure/dagster/Dockerfile
    container_name: demo_dagster_webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    environment:
      DAGSTER_POSTGRES_URL:  postgresql://dagster:dagster@dagster-db:5432/dagster
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # dlt pipeline image
      DLT_IMAGE: ${DLT_IMAGE:-dlt-pipeline:latest}
      # dlt credentials forwarded into dlt container
      DESTINATION__FILESYSTEM__BUCKET_URL: az://bronze/dlt
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      POSTGRES_CONNECTION_STRING: postgresql://admin:admin123@postgres-crm:5432/crm
      # SDP pipeline image
      SDP_IMAGE: ${SDP_IMAGE:-spark-pipeline:latest}
      # SDP credentials forwarded into spark container
      MYSQL_HOST:         mysql-ecommerce
      MYSQL_PORT:         "3306"
      MYSQL_DB:           ecommerce
      MYSQL_USER:         admin
      MYSQL_PASSWORD:     admin123
      POSTGRES_HOST:      postgres-manage
      POSTGRES_PORT:      "5432"
      POSTGRES_MANAGE_DB: manage
      POSTGRES_USER:      admin
      POSTGRES_PASSWORD:  admin123
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      # Attach pipeline containers to demo_network so they reach sibling services
      DOCKER_NETWORK: demo_network
    volumes:
      - ../dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dagster-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network

  # Dagster — daemon (scheduler + sensor)
  dagster-daemon:
    build:
      context: ../../..
      dockerfile: infrastructure/dagster/Dockerfile
    container_name: demo_dagster_daemon
    command: dagster-daemon run
    environment:
      DAGSTER_POSTGRES_URL:  postgresql://dagster:dagster@dagster-db:5432/dagster
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DLT_IMAGE: ${DLT_IMAGE:-dlt-pipeline:latest}
      DESTINATION__FILESYSTEM__BUCKET_URL: az://bronze/dlt
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      POSTGRES_CONNECTION_STRING: postgresql://admin:admin123@postgres-crm:5432/crm
      SDP_IMAGE: ${SDP_IMAGE:-spark-pipeline:latest}
      MYSQL_HOST:         mysql-ecommerce
      MYSQL_PORT:         "3306"
      MYSQL_DB:           ecommerce
      MYSQL_USER:         admin
      MYSQL_PASSWORD:     admin123
      POSTGRES_HOST:      postgres-manage
      POSTGRES_PORT:      "5432"
      POSTGRES_MANAGE_DB: manage
      POSTGRES_USER:      admin
      POSTGRES_PASSWORD:  admin123
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      DOCKER_NETWORK: demo_network
    volumes:
      - ../dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dagster-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network

  # ─────────────────────────────────────────
  # Redis — Celery broker + result backend
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: demo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - demo_network

  # ─────────────────────────────────────────
  # Celery worker-1 — dlt pipelines (dlt_crm, dlt_api)
  # Subscribes to queue "worker-1". Only receives ops tagged with
  # op_tags={"dagster-celery/queue": "worker-1"}.
  # In production this would run on a dedicated VM via docker-compose-worker1.yml.
  # ─────────────────────────────────────────
  dagster-worker-1:
    build:
      context: ../../..
      dockerfile: infrastructure/dagster/Dockerfile
    container_name: demo_dagster_worker_1
    command: dagster-celery worker start -A dagster_celery.app -q worker-1 --loglevel=info
    environment:
      DAGSTER_POSTGRES_URL: postgresql://dagster:dagster@dagster-db:5432/dagster
      CELERY_BROKER_URL:    redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DLT_IMAGE: ${DLT_IMAGE:-dlt-pipeline:latest}
      DESTINATION__FILESYSTEM__BUCKET_URL: az://bronze/dlt
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      DESTINATION__FILESYSTEM__CREDENTIALS__AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      POSTGRES_CONNECTION_STRING: postgresql://admin:admin123@postgres-crm:5432/crm
      # Azure Blob — Dagster compute logs (referenced in ../dagster.yaml)
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      DOCKER_NETWORK: demo_network
    volumes:
      - ../dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dagster-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network

  # ─────────────────────────────────────────
  # Celery worker-2 — SDP pipelines (sdp_ecommerce, sdp_manage)
  # Subscribes to queue "worker-2". Only receives ops tagged with
  # op_tags={"dagster-celery/queue": "worker-2"}.
  # In production this would run on a dedicated VM via docker-compose-worker2.yml.
  # ─────────────────────────────────────────
  dagster-worker-2:
    build:
      context: ../../..
      dockerfile: infrastructure/dagster/Dockerfile
    container_name: demo_dagster_worker_2
    command: dagster-celery worker start -A dagster_celery.app -q worker-2 --loglevel=info
    environment:
      DAGSTER_POSTGRES_URL: postgresql://dagster:dagster@dagster-db:5432/dagster
      CELERY_BROKER_URL:    redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SDP_IMAGE: ${SDP_IMAGE:-spark-pipeline:latest}
      MYSQL_HOST:         mysql-ecommerce
      MYSQL_PORT:         "3306"
      MYSQL_DB:           ecommerce
      MYSQL_USER:         admin
      MYSQL_PASSWORD:     admin123
      POSTGRES_HOST:      postgres-manage
      POSTGRES_PORT:      "5432"
      POSTGRES_MANAGE_DB: manage
      POSTGRES_USER:      admin
      POSTGRES_PASSWORD:  admin123
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY:  ${AZURE_STORAGE_ACCOUNT_KEY}
      DOCKER_NETWORK: demo_network
    volumes:
      - ../dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dagster-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network

  # ═════════════════════════════════════════
  # dlt source database
  # ═════════════════════════════════════════

  # Source: PostgreSQL — dlt CRM DB
  # Tables: orders, customers, products
  postgres-crm:
    image: postgres:15
    container_name: demo_postgres_crm
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       crm
    ports:
      - "5431:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
      - ../../../ingestion/dlt/demo/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo_network

  # ═════════════════════════════════════════
  # Spark SDP source databases
  # ═════════════════════════════════════════

  # Source: MySQL — SDP ecommerce DB
  # Tables: customers, orders, products, order_items, categories
  mysql-ecommerce:
    image: mysql:8.4
    container_name: demo_mysql_ecommerce
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:      ecommerce
      MYSQL_USER:          admin
      MYSQL_PASSWORD:      admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../../ingestion/sdp/demo/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - demo_network

  # Source: PostgreSQL — SDP manage DB
  # Tables: users, projects, tasks, issues, comments
  postgres-manage:
    image: postgres:15
    container_name: demo_postgres_manage
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB:       manage
    ports:
      - "5432:5432"
    volumes:
      - postgres_manage_data:/var/lib/postgresql/data
      - ../../../ingestion/sdp/demo/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d manage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo_network

volumes:
  dagster_db_data:
  postgres_crm_data:
  postgres_manage_data:
  mysql_data:

networks:
  demo_network:
    driver: bridge
